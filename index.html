<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>你被骗了</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:Arial,sans-serif;
  }
  .big{
    font-size:120px;
    font-weight:bold;
    color:red;
    margin-bottom:30px;
  }
  .small{
    font-size:18px;
    color:#aaa;
  }
</style>
</head>
<body>

<div class="big">你被骗了</div>
<div class="small" id="info">made by xytwuming | 本页访问次数：0</div>

<script>
// 访问次数
let count = localStorage.getItem('visitCount') || 0;
count = Number(count) + 1;
localStorage.setItem('visitCount', count);
document.getElementById('info').innerText = 
  `made by xytwuming | 本页访问次数：${count}`;
</script>

</body>
</html>
