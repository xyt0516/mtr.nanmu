<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>starail 星尘铁路mtr音频打包工具</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vorbis-encoder-js@1.0.2/dist/encoder.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --glass: rgba(255, 255, 255, 0.7);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-top: 80px;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== 顶部液态玻璃横幅 ===== */
        #liquidBanner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
        }
        #liquidBanner.show {
            transform: translateY(0);
            pointer-events: auto;
        }
        #liquidBanner .banner-text {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== 头部 ===== */
        header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }
        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        header .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .stats-bar {
            display: inline-flex;
            gap: 20px;
            align-items: center;
            background: var(--card);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .counter {
            color: var(--primary);
            font-weight: 700;
        }
        .theme-toggle {
            position: absolute;
            right: 0;
            top: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
            box-shadow: var(--shadow);
        }
        .theme-toggle:hover { transform: rotate(20deg) scale(1.1); }

        /* ===== 信息卡片 ===== */
        .info-card {
            background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
            border: 1px solid #c7d2fe;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .info-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        [data-theme="dark"] .info-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #312e81 100%);
            border-color: #4338ca;
        }
        .info-card p {
            margin: 6px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #3730a3;
        }
        [data-theme="dark"] .info-card p { color: #c7d2fe; }
        .info-card strong { color: #4f46e5; }
        [data-theme="dark"] .info-card strong { color: #a5b4fc; }

        /* ===== 控制面板 ===== */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        @media (max-width: 640px) {
            .control-panel { grid-template-columns: 1fr; }
        }
        .panel-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .panel-card h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 质量滑块 */
        .quality-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quality-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quality-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            min-width: 32px;
            text-align: center;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 编码器状态 */
        .encoder-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #dcfce7;
            color: #166534;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #86efac;
        }
        .encoder-pill .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== 拖拽区域 ===== */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius);
            padding: 48px 24px;
            text-align: center;
            background: var(--card);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .drop-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(99,126,234,0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #667eea;
            background: #f5f3ff;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .drop-zone:hover::before, .drop-zone.dragover::before { opacity: 1; }
        [data-theme="dark"] .drop-zone:hover { background: #1e1b4b; }
        .drop-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .drop-zone p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 1rem;
        }

        /* ===== 按钮 ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .btn-success:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 文件列表 ===== */
        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .file-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .file-count b { color: var(--primary); }
        #fileList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .file-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .file-card:hover {
            border-color: #c7d2fe;
            transform: translateX(4px);
        }
        .file-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .file-status {
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-ogg { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-done { background: #dbeafe; color: #1e40af; }
        .file-id-input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            width: 160px;
            background: var(--bg);
            color: var(--text);
            transition: all 0.2s;
        }
        .file-id-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .file-id-input.invalid {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .file-id-input.duplicate {
            border-color: #f59e0b;
            background: #fffbeb;
        }
        .btn-delete {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .btn-delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .pack-name-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .pack-name-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }
        .pack-name-group input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--bg);
            color: var(--text);
            width: 180px;
            transition: all 0.2s;
        }
        .pack-name-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* ===== 进度条 ===== */
        .progress-area {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: none;
        }
        .progress-area.active { display: block; animation: slideIn 0.3s; }
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .progress-track {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
        }
        .progress-detail {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        .progress-detail .speed { color: var(--primary); font-weight: 600; }

        /* ===== 消息提示 ===== */
        #message {
            margin-bottom: 16px;
        }
        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s;
            margin-bottom: 8px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* ===== 页脚 ===== */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        footer .heart {
            color: #ec4899;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        footer .author {
            margin-top: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1rem;
        }
        .github-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .github-badge:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border
